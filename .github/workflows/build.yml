name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102
      - name: Core checks
        run: dotnet run --project Switchit.Core.Tests/Switchit.Core.Tests.csproj
      - name: Hidden WPF checks
        run: dotnet run --project Switchit.UI.Tests/Switchit.UI.Tests.csproj -- artifacts/ui
      - name: Build self-contained installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Switchit-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/Switchit-win-x64-self-contained.zip
